version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # @types/node should track the runtimes this package supports (the
      # engines floor is 18; CI verifies 18 and tests on 22/24). Major
      # jumps risk typing against APIs those runtimes don't have.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly