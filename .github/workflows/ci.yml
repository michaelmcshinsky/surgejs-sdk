name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Summarize coverage
        if: matrix.node-version == 22
        run: node scripts/coverage-summary.mjs
      - name: Upload coverage report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - run: pnpm build
      # packaging validators only need to run once
      - if: matrix.node-version == 22
        run: pnpm publint
      - if: matrix.node-version == 22
        run: pnpm attw
      # The matrix's lowest version is the package.json engines floor; keep
      # them in step when bumping either. (A separate pre-EOL Node 18 job
      # was tried and removed: the vitest toolchain cannot boot there
      # (util.styleText, Node >= 20.12), and both 18 and 20 are EOL.)
