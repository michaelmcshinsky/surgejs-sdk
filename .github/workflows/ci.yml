name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      # packaging validators only need to run once
      - if: matrix.node-version == 22
        run: pnpm publint
      - if: matrix.node-version == 22
        run: pnpm attw
      # The matrix's lowest version is the package.json engines floor; keep
      # them in step when bumping either. (A separate pre-EOL Node 18 job
      # was tried and removed: the vitest toolchain cannot boot there
      # (util.styleText, Node >= 20.12), and both 18 and 20 are EOL.)
